{% extends "base.html" %}

{% block title %}WhatUpSF — San Francisco, right now{% endblock %}

{% block body_class %}page-city{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
    /* ============================================================================
       WhatUpSF — citywide
       Three parts, one instrument: the city window, the time rail down its edge, and
       the dock beneath it. They share edges and gutters so the composition reads as a
       single object rather than widgets stacked on a map.
       ============================================================================ */

    :root {
        --dock-h: 120px;
        --rail-w: 72px;
        --ink-0: #07090d;   /* deepest, behind everything */
        --ink-1: #0c1016;   /* dock/rail ground */
        --ink-2: #161c25;   /* hairlines */
        --text-0: #eef2f7;
        --text-1: #97a3b4;
        --text-2: #5e6a7a;
        --accent: #ff7a45;  /* the single warm accent: happening now */
        --gutter: 18px;
    }

    /* The city page is a fixed composition, not a scrolling document. */
    body.page-city { overflow: hidden; background: var(--ink-0); }
    /* The wordmark lives on the map's left edge here, so the header keeps only navigation
       and hands the reclaimed height back to the city. */
    body.page-city { --header-h: 44px; }
    body.page-city .site-header h1 { display: none; }
    body.page-city .site-header { background: var(--ink-0); border-bottom-color: var(--ink-2); }
    /* The header is position:fixed, so it is not a grid child — only .city and .dock are.
       Its height is reserved with padding rather than a grid row. */
    body.page-city .site-main {
        height: 100dvh;
        box-sizing: border-box;
        display: grid;
        grid-template-rows: 1fr auto;
    }

    /* ---- city window --------------------------------------------------------- */

    .city {
        position: relative;
        min-height: 0;               /* lets the grid row actually shrink */
        border-bottom: 1px solid var(--ink-2);
        background: var(--ink-0);
    }

    #map { position: absolute; inset: 0; background: var(--ink-0); }

    /* Art direction on the basemap: push it back so markers and type sit in front of the
       city rather than competing with it. Applied to the tile pane only, so vector markers
       keep their full contrast. */
    /* Stadia's "smooth dark" is a mid grey out of the box — too light to sit behind type and
       markers. Pushed down and desaturated so the city reads as night and the marks read as
       information on top of it, without losing street legibility. */
    .leaflet-tile-pane { filter: brightness(0.66) saturate(0.72) contrast(1.14); }

    /* Tonal falloff toward the edges, strongest clarity in the middle of the frame. */
    .city__vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 500;
        background:
            radial-gradient(116% 82% at 50% 44%, rgba(7,9,13,0) 46%, rgba(7,9,13,0.72) 100%),
            linear-gradient(to bottom, rgba(7,9,13,0.55) 0%, rgba(7,9,13,0) 12%);
    }

    .leaflet-container { background: var(--ink-0); font: inherit; }
    .leaflet-control-attribution {
        background: rgba(7,9,13,0.55) !important;
        color: var(--text-2) !important;
        font-size: 9px !important;
        padding: 1px 6px !important;
        pointer-events: none;
    }
    .leaflet-control-attribution a { color: var(--text-2) !important; pointer-events: auto; }

    /* ---- markers ------------------------------------------------------------- */

    .venue-mark {
        transition: opacity .28s ease, stroke-width .28s ease, r .28s ease;
        cursor: pointer;
    }

    .sel-halo { transform-box: fill-box; transform-origin: center; }
    .sel-halo--in { animation: haloIn .34s cubic-bezier(.2,.8,.3,1); }
    @keyframes haloIn {
        from { transform: scale(.45); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
    }

    /* "You are here" — present and findable, but it is not the subject of the screen. */
    .me-dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #ff5a4d;
        border: 2px solid rgba(255,255,255,.92);
        box-shadow: 0 0 0 4px rgba(255,90,77,.18);
        animation: mePulse 3.2s ease-in-out infinite;
    }
    @keyframes mePulse {
        0%, 100% { box-shadow: 0 0 0 4px rgba(255,90,77,.18); }
        50%      { box-shadow: 0 0 0 8px rgba(255,90,77,.05); }
    }

    /* Identity as part of the composition rather than a bar across the top: set into the
       left margin of the city window, quiet enough to ignore. */
    .citymark {
        position: absolute; z-index: 610;
        left: 0; top: 50%; transform: translateY(-50%);
        writing-mode: vertical-rl; rotate: 180deg;
        padding: 0 3px;
        font-size: 14px; font-weight: 800;
        letter-spacing: .34em; text-transform: uppercase;
        color: #46525f;
        pointer-events: none;
        user-select: none;
    }

    /* ---- recenter ------------------------------------------------------------ */

    .recenter {
        position: absolute; z-index: 620;
        left: var(--gutter); bottom: var(--gutter);
        width: 44px; height: 44px;
        display: grid; place-items: center;
        border-radius: 12px;
        border: 1px solid var(--ink-2);
        background: rgba(12,16,22,.82);
        backdrop-filter: blur(8px);
        color: #ff5a4d;
        cursor: pointer;
        transition: border-color .2s ease, transform .15s ease;
    }
    .recenter:hover { border-color: #33404f; transform: translateY(-1px); }
    /* Without a fix the control is still tappable — it asks again — but it should not imply
       it knows where you are. */
    .recenter.is-idle { color: var(--text-2); }
    .recenter.is-locating { color: var(--accent); animation: locating 1.1s ease-in-out infinite; }
    @keyframes locating { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .recenter svg { width: 19px; height: 19px; }

    /* ---- vertical city-time rail --------------------------------------------- */

    .rail {
        position: absolute; z-index: 620;
        top: 0; right: 0; bottom: 0;
        width: var(--rail-w);
        display: flex; flex-direction: column; align-items: stretch;
        padding: 16px 0 16px;
        /* Only the controls capture touch; the gradient is decoration and lets the map be
           panned right up to the screen edge. Without this the rail quietly stole a 72px
           strip of the city. */
        pointer-events: none;
        -webkit-user-select: none; user-select: none;
        background: linear-gradient(to left, rgba(7,9,13,.94) 34%, rgba(7,9,13,.6) 70%, rgba(7,9,13,0) 100%);
    }

    .rail__track {
        position: relative; flex: 1 1 auto; margin-right: 26px;
        cursor: grab; outline: none;
        pointer-events: auto; touch-action: none;
    }
    .rail__track.is-dragging { cursor: grabbing; }
    .rail__track:focus-visible { outline: 1px solid rgba(255,122,69,.6); outline-offset: 6px; }

    .rail__line {
        position: absolute; top: 0; bottom: 0; right: 0;
        width: 1px; background: var(--ink-2);
    }

    /* Labels and the thumb are read-outs, not controls. Leaving them hit-testable let a tick
       sit on top of the LIVE NOW button and swallow taps meant for it. */
    .rail__ticks, .rail__tick, .rail__thumb, .rail__chip, .rail__nowmark, .rail__line {
        pointer-events: none;
    }
    .rail__tick { position: absolute; right: 0; transform: translateY(-50%); display: flex; align-items: center; gap: 5px; }
    .rail__tick i { order: 2; width: 6px; height: 1px; background: #26303c; }
    .rail__tick b {
        order: 1; font-size: 9px; font-weight: 600; letter-spacing: .04em;
        color: #7a8798; white-space: nowrap;
        text-shadow: 0 0 4px rgba(7,9,13,.95), 0 0 8px rgba(7,9,13,.75);
    }

    /* Where the real clock sits, distinct from wherever the user has dragged to. */
    .rail__nowmark {
        position: absolute; right: -3px; width: 7px; height: 7px; margin-top: -3.5px;
        border-radius: 50%; background: var(--accent);
        box-shadow: 0 0 0 3px rgba(255,122,69,.16);
    }

    .rail__thumb {
        position: absolute; right: -1px; width: 3px; height: 22px; margin-top: -11px;
        background: var(--text-0); border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(7,9,13,.9);
        transition: top .12s ease-out;
    }
    .rail__track.is-dragging .rail__thumb { transition: none; }

    /* Clear of the hour-label column so the current value never hides a tick. */
    .rail__chip {
        position: absolute; right: 44px; top: 50%; transform: translateY(-50%);
        padding: 3px 8px;
        font-size: 11px; font-weight: 600; letter-spacing: .01em;
        color: var(--text-0); white-space: nowrap;
        background: rgba(12,16,22,.94);
        border: 1px solid var(--ink-2);
        border-radius: 6px;
    }

    /* ---- dock ---------------------------------------------------------------- */

    .dock {
        position: relative;
        min-height: var(--dock-h);
        padding: 11px var(--gutter) calc(10px + var(--safe-b));
        background: var(--ink-1);
        display: grid;
        grid-template-areas: "context" "transport" "credit";
        gap: 2px;
    }

    .dock__context {
        grid-area: context;
        display: block; width: 100%;
        text-align: left; background: none; border: 0; padding: 0;
        color: inherit; cursor: pointer;
        transition: opacity .18s ease;
    }
    .dock.is-swapping .dock__context { opacity: 0; }

    .dock__eyebrow {
        display: block;
        font-size: 9.5px; font-weight: 700; letter-spacing: .16em;
        color: var(--accent);
        margin-bottom: 3px;
    }
    .dock__title {
        display: block;
        font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.15;
        color: var(--text-0);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dock__sub {
        display: block;
        font-size: 12px; color: var(--text-1); margin-top: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Three columns so the transport stays optically centred while LIVE NOW occupies the
       space to its right instead of leaving it dead. */
    .dock__transport {
        grid-area: transport;
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        margin-top: 5px;
    }
    .dock__keys { display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* The way back to the present: loud once you have scrubbed away, a quiet status light
       when the city is already showing now. */
    .dock__live {
        grid-column: 3; justify-self: end;
        position: relative;
        display: flex; align-items: center; gap: 5px;
        min-height: 32px; padding: 0 10px;
        font-size: 9.5px; font-weight: 700; letter-spacing: .09em;
        white-space: nowrap;
        border-radius: 999px;
        cursor: pointer;
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #1a0d06;
        box-shadow: 0 2px 14px rgba(255,122,69,.35);
        transition: background .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease;
    }
    .dock__live::after { content: ''; position: absolute; inset: -7px 0; }
    .dock__live-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
    .dock__live.is-live {
        background: transparent;
        border-color: rgba(255,122,69,.4);
        color: var(--accent);
        box-shadow: none;
    }

    .dock__btn {
        display: grid; place-items: center;
        background: none; border: 0; padding: 0;
        color: var(--text-1);
        cursor: pointer;
        transition: color .18s ease, transform .12s ease, border-color .18s ease;
    }
    .dock__btn:disabled { opacity: .3; cursor: default; }
    .dock__btn svg { fill: currentColor; }

    /* Subordinate, but still a comfortable target. */
    .dock__btn--side { width: 46px; height: 46px; }
    .dock__btn--side svg { width: 20px; height: 20px; }
    .dock__btn--side:hover:not(:disabled) { color: var(--text-0); }

    /* Play is the primary control and should read that way instantly. */
    .dock__btn--play {
        width: 52px; height: 52px;
        border-radius: 50%;
        border: 1px solid #2b3644;
        color: var(--text-0);
        background: #131a23;
    }
    .dock__btn--play svg { width: 21px; height: 21px; }
    .dock__btn--play:hover:not(:disabled) { border-color: var(--accent); transform: scale(1.03); }
    .dock__icon-pause { display: none; }
    .dock.is-playing .dock__icon-play { display: none; }
    .dock.is-playing .dock__icon-pause { display: block; }
    .dock.is-playing .dock__btn--play { border-color: rgba(255,122,69,.55); }

    .dock__credit {
        grid-area: credit;
        text-align: center;
        font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
        color: var(--text-2);
        margin-top: 3px;
    }

    /* The player is controlled through the IFrame API; the dock provides the interface. */
    .dock__player {
        position: absolute; width: 1px; height: 1px;
        left: -9999px; top: auto; overflow: hidden;
    }

    /* ---- bottom sheet (fuller detail) --------------------------------------- */

    #event-bottom-sheet {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200;
        max-height: 72dvh; overflow-y: auto;
        padding: 10px var(--gutter) calc(22px + var(--safe-b));
        background: #0e131a;
        border-top: 1px solid var(--ink-2);
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
        transition: transform .28s cubic-bezier(.2,.7,.3,1);
    }
    #event-bottom-sheet.open { transform: translateY(0); }
    .drag-handle {
        width: 36px; height: 4px; border-radius: 2px;
        background: #2a3542; margin: 0 auto 14px;
    }
    .sheet__venue { font-size: 20px; font-weight: 600; color: var(--text-0); letter-spacing: -.015em; }
    .sheet__meta { font-size: 11px; color: var(--text-2); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
    .sheet__list { list-style: none; margin: 14px 0 0; padding: 0; }
    .sheet__list li {
        display: flex; gap: 12px; align-items: baseline;
        padding: 9px 0; border-top: 1px solid var(--ink-2);
    }
    .sheet__list span { flex: 0 0 66px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .sheet__list b { font-size: 13.5px; font-weight: 500; color: var(--text-0); }
    .sheet__link { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--accent); text-decoration: none; }

    #loading-indicator {
        position: absolute; z-index: 700; top: 50%; left: 50%; transform: translate(-50%,-50%);
        font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-2);
    }

    /* ---- larger screens ------------------------------------------------------ */

    @media (min-width: 768px) {
        :root { --rail-w: 84px; --dock-h: 116px; --gutter: 26px; }
        .dock {
            grid-template-areas: "context transport credit";
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }
        .dock__transport { margin-top: 0; }
        .dock__credit { text-align: right; margin-top: 0; }
        .dock__live { font-size: 10px; letter-spacing: .12em; padding: 0 13px; }
        .dock__keys { gap: 14px; }
        .dock__title { font-size: 21px; }
        #event-bottom-sheet { left: 50%; right: auto; width: min(560px, 92vw); transform: translate(-50%, 100%); }
        #event-bottom-sheet.open { transform: translate(-50%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .venue-mark, .rail__thumb, .dock__context, .dock__btn,
        #event-bottom-sheet, .recenter, .dock__live { transition: none !important; }
        .me-dot, .sel-halo--in, .recenter.is-locating { animation: none !important; }
    }
</style>
{% endblock %}

{% block content %}
<div class="city">
    <div id="map"></div>
    <div class="city__vignette"></div>

    <button id="recenter" class="recenter" type="button" aria-label="Recenter on my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"/>
        </svg>
    </button>

    <div class="citymark">WhatUpSF</div>

    <div id="city-rail" class="rail" aria-label="City time"></div>

    <div id="loading-indicator">Tuning in…</div>
</div>

<div id="dock" class="dock"></div>
<div id="event-bottom-sheet"></div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/static/js/map-app.js?v=20260810a"></script>
{% endblock %}
